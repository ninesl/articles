name: Publish articles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, articles]
    env:
      DAGGER_ENGINE: container+podman://dagger-engine-v1.0.0-beta.13
      REGISTRY: registry.ninescoding.com
      APPLICATION_NAME: ninescoding
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update articles checkout
        run: |
          dest="$HOME/prod/ninescoding/articles"
          mkdir -p "$dest"
          rsync -a --delete "$GITHUB_WORKSPACE/" "$dest/"

      - name: Read current lifetime clicks
        id: clicks
        run: |
          count=$(curl -fsSL --max-time 1 https://ninescoding.com/count) || true
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Redeploy site
        env:
          DEPLOY_VALUES: |
            APP_IMAGE=registry.ninescoding.com/ninescoding:latest
            INITIAL_COUNT=${{ steps.clicks.outputs.count }}
        run: |
          "$HOME/.local/bin/dagger" -W github.com/ninesl/daggerer@master api call \
            deploy \
            --registry="$REGISTRY" \
            --app-name="$APPLICATION_NAME" \
            --registry-username="$(<"$HOME/secrets/runner_registry_user")" \
            --registry-password="file://$HOME/secrets/runner_registry_token" \
            --ssh-key="file://$HOME/secrets/ssh_key" \
            --known-hosts="file://$HOME/secrets/known_hosts" \
            --ssh-target="debian@host.containers.internal" \
            --ssh-target-port=1337 \
            --deploy-directory="prod/$APPLICATION_NAME" \
            --deploy-container-runtime=podman \
            --deploy-values="$DEPLOY_VALUES"
